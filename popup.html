<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>밑줄 노트 - 전체</title>
  <style>
    :root { --bg:#ffffff; --card:#f6f6f9; --line:#e4e4ea; --text:#1f2328; --sub:#667085; --accent:#7a5af0; --accent-text:#6b4fd8; --danger:#e5686b; }
    * { box-sizing: border-box; }
    body { position: relative; width: 100%; min-width: 280px; height: 100vh; display: flex; flex-direction: column; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
    button { border: 0; background: none; color: var(--sub); cursor: pointer; font: inherit; padding: 4px 6px; border-radius: 6px; }
    button:hover { color: var(--text); background: #eceef3; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; }
    header svg { display: block; }
    .logo { padding: 0; width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    h1 { flex: 1; min-width: 0; font-size: 15px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #count { font-size: 11px; color: #fff; background: var(--accent); border-radius: 10px; padding: 1px 9px; }

    #filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
    #filters:empty { display: none; }
    .chip { background: #efeafe; color: var(--accent-text); font-size: 11px; padding: 2px 4px 2px 10px; border-radius: 12px; }
    .chip.reset { background: none; border: 1px solid #e4e4ea; color: var(--sub); padding: 2px 10px; }
    .chip.reset:hover { background: #eceef3; color: var(--text); }
    .chip:hover { background: #e2d9ff; color: #4b34b0; }

    #cal { margin: 0 12px 10px; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    #cal .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
    #summary { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); text-align: center; }
    #summary b { color: var(--accent-text); font-weight: 600; }
    #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    #grid .dow { font-size: 11px; color: var(--sub); padding: 2px 0; }
    #grid button { height: 38px; padding: 0; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
    #grid .cnt { font-size: 10px; font-weight: 600; color: var(--accent-text); }
    #grid button.sel { background: var(--accent); color: #fff; }
    #grid button.sel .cnt { color: #fff; }
    #grid button.today { outline: 1px solid var(--accent-text); }

    ul { list-style: none; margin: 0; padding: 0 12px 12px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    li:hover { border-color: var(--accent); }
    .row { display: flex; gap: 10px; align-items: flex-start; }
    .thumb { flex: none; width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #eceef3; }
    .text { flex: 1; min-width: 0; color: inherit; text-decoration: none; cursor: pointer; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
    a.text:hover { color: var(--accent-text); }
    .site { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--accent-text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.site:hover { text-decoration: underline; }
    .site.none { color: var(--sub); }
    .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--sub); }
    .meta .time { flex: 1; display: flex; align-items: center; gap: 4px; }
    .meta button { display: flex; padding: 4px; }
    .meta button.del:hover { color: var(--danger); background: #fdecec; }
    #foot { position: relative; z-index: 3; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-height: 32px; padding: 0 8px 0 12px; background: var(--card); border-top: 1px solid var(--line); }
    #foot .l { display: flex; align-items: center; flex-wrap: wrap; gap: 0 8px; margin-right: auto; min-width: 0; font-size: 9px; color: var(--sub); }
    #foot .l a { color: var(--sub); text-decoration: none; white-space: nowrap; }
    #foot .l a:hover { color: var(--accent-text); text-decoration: underline; }
    #ver { font-size: 11px; color: var(--sub); }
    #setBtn { display: flex; padding: 4px; }
    #list { padding-bottom: 12px; }
    #list:empty { display: none; }
    #empty[hidden] { display: none; }
    #empty.full { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 28px 48px; text-align: center; }
    #empty.full svg { stroke: var(--sub); }
    #empty.full .t { color: var(--text); font-size: 14px; font-weight: 600; }
    #empty.full b { color: var(--accent-text); font-weight: 600; }
    #empty { white-space: pre-line; color: var(--sub); text-align: center; padding: 28px 16px 36px; margin: 0; }

    #scrim { position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
    #drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 220px; background: #f7f7fa; border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .2s; display: flex; flex-direction: column; padding: 12px 8px; }
    body.menu #scrim { opacity: 1; pointer-events: auto; }
    body.menu #drawer { transform: none; }
    #drawer h2 { font-size: 11px; color: var(--sub); font-weight: 600; margin: 4px 8px 8px; }
    #cats { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    #cats button { display: flex; justify-content: space-between; gap: 8px; text-align: left; color: var(--text); padding: 7px 8px; }
    #cats button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #cats button span:last-child { color: var(--sub); font-size: 11px; }
    #cats button.on { background: #efeafe; color: var(--accent-text); }

    body.pop { width: 400px; height: 580px; }
    #set { position: absolute; top: 44px; left: 0; right: 0; bottom: 33px; background: var(--bg); padding: 4px 12px 28px; overflow-y: auto; z-index: 2; }
    #set[hidden] { display: none; }
    #set h2 { font-size: 11px; color: var(--sub); font-weight: 600; margin: 4px 0 8px; }
    #set label { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    #set label:has(input:checked) { border-color: var(--accent); background: #f1ecff; }
    #set label.off { opacity: .45; cursor: not-allowed; }
    #set label > span { flex: 1; }
    #set .pic { flex: none; margin-left: auto; align-self: center; color: var(--sub); }
    #set .note { margin-top: 4px; padding: 8px 10px; border-radius: 8px; background: #efeafe; color: var(--accent-text); font-size: 11px; }
    #set input { margin: 3px 0 0; accent-color: var(--accent); }
    #set b { display: block; font-weight: 600; }
    #set small { color: var(--sub); font-size: 11px; }
    #toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 5px 14px; border-radius: 14px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <button id="menuBtn" aria-label="카테고리 메뉴">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="logo" id="home" title="전체 목록으로" aria-label="전체 목록으로">My</button>
    <h1 id="title">전체</h1>
    <span id="count">0</span>
    <button id="calBtn" aria-label="달력 보기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </button>
  </header>
  <section id="set" hidden>
    <h2>표시 방식</h2>
    <label><input type="radio" name="mode" id="m_popup" value="popup"><span><b>팝업</b><small>툴바 아이콘 아래에 붙어 열립니다. 바깥을 누르면 닫힙니다.</small></span><svg class="pic" width="44" height="32" viewBox="0 0 44 32" aria-hidden="true"><rect x="1.5" y="1.5" width="41" height="29" rx="3" fill="none" stroke="currentColor"/><path d="M1.5 8h41" stroke="currentColor"/><rect x="26" y="10" width="15" height="14" rx="2" fill="var(--accent)" opacity=".85"/></svg></label>
    <label><input type="radio" name="mode" id="m_window" value="window"><span><b>새 창</b><small>독립된 창으로 열립니다. 직접 닫기 전까지 유지됩니다.</small></span><svg class="pic" width="44" height="32" viewBox="0 0 44 32" aria-hidden="true"><rect x="1.5" y="1.5" width="30" height="21" rx="3" fill="none" stroke="currentColor"/><rect x="14" y="9" width="28" height="21" rx="3" fill="var(--card)" stroke="var(--accent)" stroke-width="1.5"/><path d="M14 14h28" stroke="var(--accent)"/></svg></label>
    <label id="panelOpt"><input type="radio" name="mode" id="m_panel" value="panel"><span><b>사이드 패널</b><small id="panelNote">화면 오른쪽에 붙어 페이지를 옆으로 밀어냅니다.</small></span><svg class="pic" width="44" height="32" viewBox="0 0 44 32" aria-hidden="true"><rect x="1.5" y="1.5" width="41" height="29" rx="3" fill="none" stroke="currentColor"/><path d="M1.5 8h41" stroke="currentColor"/><rect x="29" y="8" width="13.5" height="22.5" fill="var(--accent)" opacity=".85"/></svg></label>
    <div class="note" id="setNote">선택하면 별도의 저장 없이 바로 저장되고, 다음에 아이콘을 누를 때부터 적용됩니다.</div>
  </section>
  <div id="filters"></div>
  <div id="cal" hidden>
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <span id="monthLabel"></span>
      <button id="next" aria-label="다음 달">›</button>
    </div>
    <div id="grid"></div>
    <div id="summary"></div>
  </div>
  <ul id="list"></ul>
  <div id="empty" hidden></div>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="카테고리">
    <h2>카테고리 (저장한 사이트 기준)</h2>
    <div id="cats"></div>
  </aside>
  <div id="foot"><span class="l"><span>© 2026 밑줄노트. All rights reserved</span><a href="mailto:test@gmail.com">E-mail 문의</a><a href="https://plan-p-1b255.web.app/" target="_blank" rel="noopener noreferrer">제작자 블로그</a></span><span id="ver"></span>
    <button id="setBtn" aria-label="설정" title="설정">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div id="toast">복사됨!</div>
  <script src="popup.js"></script>
</body>
</html>
